[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profitlens-ingestion"
version = "0.1.0"
description = "Week 1 import validation preview for the ProfitLens minor project"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "pypdf>=6,<7",
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]
