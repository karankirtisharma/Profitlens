[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "profitlens"
version = "0.3.0"
description = "Authenticated business-data workspace and ingestion for ProfitLens"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "pypdf>=6,<7",
  "fastapi>=0.121,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1", "pydantic-settings>=2.7,<3",
]

[tool.setuptools]
package-dir = {"" = "apps/api"}

[tool.setuptools.packages.find]
where = ["apps/api"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "reportlab>=4,<6", "ruff>=0.17,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]
