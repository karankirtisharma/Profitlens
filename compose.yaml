services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: profitlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: profitlens
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U profitlens -d profitlens"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data:
