name: Application checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: profitlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: profitlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U profitlens -d profitlens"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://profitlens:ci-only-password@localhost:5432/profitlens
      TEST_DATABASE_URL: postgresql+psycopg://profitlens:ci-only-password@localhost:5432/profitlens_test
      E2E_DATABASE_URL: postgresql+psycopg://profitlens:ci-only-password@localhost:5432/profitlens_e2e_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements.lock
          .venv/bin/python -m pip install -e . --no-deps
      - name: Create dedicated test databases and migrate
        run: |
          .venv/bin/python - <<'PY'
          import psycopg
          with psycopg.connect("postgresql://profitlens:ci-only-password@localhost:5432/profitlens", autocommit=True) as conn:
              conn.execute("CREATE DATABASE profitlens_test")
              conn.execute("CREATE DATABASE profitlens_e2e_test")
          PY
          .venv/bin/python -m alembic upgrade head
          .venv/bin/python -m alembic check
      - name: Python checks
        run: |
          .venv/bin/python -m ruff check apps/api tests scripts migrations
          .venv/bin/python -m ruff format --check apps/api tests scripts migrations
          .venv/bin/python -m pytest -q
      - name: Frontend checks
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run build
          npm run format:check
          npm audit --omit=dev --audit-level=high
      - name: Browser acceptance tests
        working-directory: apps/web
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: apps/web/test-results
          retention-days: 7
